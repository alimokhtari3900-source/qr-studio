name: Build QR Studio Pro Luxe Android APK
'on':
  workflow_dispatch:
  push:
    branches: [version-3-luxe]
permissions:
  contents: read
  actions: read
jobs:
  build-pro-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Pro Luxe brand icon assets
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          mkdir -p assets/branding
          rsvg-convert -w 1024 -h 1024 -o assets/branding/qr-studio-luxe-icon.png assets/branding/qr-studio-luxe-icon.svg
          rsvg-convert -w 1024 -h 1024 -o assets/branding/qr-studio-luxe-foreground.png assets/branding/qr-studio-luxe-foreground.svg
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate independent Android project
        run: flutter create --project-name qr_studio_pro_luxe --org com.qrstudio.pro.luxe --platforms=android .
      - name: Enable internet access and set Pro Luxe app name
        run: |
          sed -i '/<application/i\    <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="qr_studio_pro_luxe"/android:label="QR Studio Pro Luxe"/' android/app/src/main/AndroidManifest.xml
      - name: Install packages
        run: flutter pub get
      - name: Generate Pro Luxe launcher icons
        run: dart run flutter_launcher_icons
      - name: Static analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Build installable Pro Luxe APK
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
        run: |
          SITE_URL="$PUBLIC_SITE_URL"
          if [ -z "$SITE_URL" ]; then SITE_URL="https://alimokhtari3900-source.github.io/qr-studio/luxe"; fi
          case "$SITE_URL" in
            */luxe) ;;
            */pro) SITE_URL="${SITE_URL%/pro}/luxe" ;;
            */qr-studio) SITE_URL="$SITE_URL/luxe" ;;
            *) SITE_URL="$SITE_URL/luxe" ;;
          esac
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            --dart-define=PUBLIC_SITE_URL="$SITE_URL"
          mkdir -p output
          cp build/app/outputs/flutter-apk/app-release.apk output/QR-Studio-Pro-Luxe.apk
      - uses: actions/upload-artifact@v4
        with:
          name: QR-Studio-Pro-Luxe-APK
          path: output/QR-Studio-Pro-Luxe.apk
          retention-days: 30
