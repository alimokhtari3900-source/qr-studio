name: qr_studio
description: QR Studio product management app
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.18.3
  qr_flutter: ^4.1.0
  image_picker: ^1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  image_path: assets/branding/qr-studio-icon.png
  adaptive_icon_background: "#17102B"
  adaptive_icon_foreground: assets/branding/qr-studio-foreground.png
  adaptive_icon_foreground_inset: 12
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/branding/qr-studio-icon.png
